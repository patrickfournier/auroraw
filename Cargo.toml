[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
repository = "https://github.com/patrickfournier/auroraw"
publish = false

[workspace.dependencies]
proptest = "1"
tempfile = "3"
fastrand = "2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
