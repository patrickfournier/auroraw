# SPDX-License-Identifier: GPL-3.0-or-later
# A spike, not a product crate: the interface slice on Qt Quick through cxx-qt. Standalone (its own
# workspace) so that the product workspace, its lockfile and its CI are untouched.
[package]
name = "qt-ui-spike"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["full"] }
directories = "6"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
auroraw-catalogue = { path = "../../crates/catalogue" }
auroraw-engine = { path = "../../crates/engine" }
auroraw-types = { path = "../../crates/types" }

[build-dependencies]
cxx-qt-build = "0.10"
