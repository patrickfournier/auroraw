[package]
name = "viewer-catalogue"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
catalogue = { version = "0.1.0", path = "../catalogue" }
fastrand = "2.5.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
slint = "1.18.0"

[build-dependencies]
slint-build = "1.18.0"
