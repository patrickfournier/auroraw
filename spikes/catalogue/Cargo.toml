[package]
name = "catalogue"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
fast_image_resize = "6.1.0"
fastrand = "2.5.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
jpeg-encoder = "0.7.1"
libc = "0.2.189"
mimalloc = { version = "0.1.52", optional = true }
quick-xml = "0.42.0"
rawler = "0.8.0"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[features]
mimalloc = ["dep:mimalloc"]
