# Dependency policy, checked by `cargo deny check` in continuous integration
# (docs/continuous-integration.md §5, docs/governance.md §2.2).

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]

[advisories]
yanked = "deny"
ignore = [
    # ttf-parser: its author calls it unmaintained (no CVE, no known exploit, "no safe upgrade
    # available"), several levels deep in Slint's own Linux/Wayland decoration dependency chain
    # (sctk-adwaita, via winit) -- nothing this project's own Cargo.toml can act on. Revisit when
    # Slint updates its dependency, or a safe upgrade appears.
    "RUSTSEC-2026-0192",
]

[licenses]
# Compatible with the GPL-3.0-or-later. No AGPL, no proprietary or non-commercial licence.
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0-only", # slint (D-072, D-080): Auroraw takes it under this option, matching our own GPL-3.0.
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "Unlicense", # ksni (a Slint/Linux dependency): public domain dedication, permissive.
    "LGPL-2.1",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "IJG", # jpeg-encoder: the Independent JPEG Group License, permissive
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
