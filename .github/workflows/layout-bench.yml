name: Layout benchmark

# Measures workspace directory layouts on each file system (docs/design/001-workspace-layout.md).
# Runs when the benchmark or this file changes, or on demand. Temporary: deleted once the design
# note is settled.

on:
  push:
    paths:
      - tools/layout-bench.rs
      - .github/workflows/layout-bench.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.os-name }} ${{ matrix.layout }} ${{ matrix.n }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        os-name: [windows-x64]
        layout: [flat, shard256, shard4096, perphoto]
        n: [20000, 100000]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustc -O tools/layout-bench.rs -o layout-bench
      - shell: bash
        run: ./layout-bench ${{ matrix.layout }} ${{ matrix.n }}
