name: Layout benchmark

# Measures workspace directory layouts on each file system (docs/design/001-workspace-layout.md).
# Runs when the benchmark or this file changes, or on demand. Temporary: deleted once the design
# note is settled.

on:
  push:
    paths:
      - tools/layout-bench.rs
      - .github/workflows/layout-bench.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: windows-x64, os: windows-2025 }
          - { name: macos-arm64, os: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustc -O tools/layout-bench.rs -o layout-bench
      - name: Run the four layouts, twice
        shell: bash
        run: |
          for pass in 1 2; do
            for layout in flat shard256 shard4096 perphoto; do
              ./layout-bench $layout 100000
            done
          done
