name: Qt tools check

# Temporary (Qt UI port, milestone Q1): which Qt tools does the CI install give us on each platform
# (lupdate, lrelease, lconvert...)? Runs only when this file changes, on feature/qt-ui; removed once the
# answer is in the Q1 commit message.

on:
  push:
    branches: [feature/qt-ui]
    paths: ['.github/workflows/qt-tools-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    name: tools (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: windows-x64, os: windows-2025, arch: win64_msvc2022_64 }
          - { name: macos-arm64, os: macos-15 }
    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: 6.8.3
          arch: ${{ matrix.arch }}
          cache: true
      - name: Which tools
        shell: bash
        run: |
          bins="$(qmake -query QT_INSTALL_BINS)"
          libexec="$(qmake -query QT_INSTALL_LIBEXECS)"
          echo "bins: $bins"
          echo "libexecs: $libexec"
          for dir in "$bins" "$libexec"; do
            ls "$dir" | grep -i -E "lupdate|lrelease|lconvert|qmlcachegen|qmltyperegistrar|^rcc|^moc|qmlimportscanner|qmlformat|qmllint" || true
          done
          for t in lupdate lrelease lconvert; do
            if command -v "$t" >/dev/null 2>&1; then echo "on PATH: $t"; else echo "NOT on PATH: $t"; fi
          done
