name: Nightly

# Long runs that do not belong in the per-change workflow (docs/continuous-integration.md §3.2):
# the property tests with many cases, and the large-workspace measurement on each file system.
# Runs every night, on demand, and when this file or the measurement changes.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/nightly.yml
      - crates/workspace/tests/large.rs

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  properties:
    name: property tests, many cases
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --release --locked
        env:
          PROPTEST_CASES: "5000"

  large-workspace:
    name: large workspace (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: windows-x64, os: windows-2025 }
          - { name: macos-arm64, os: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Write, walk and read 100,000 photos and their versions
        run: cargo test -p auroraw-workspace --release --locked --test large -- --ignored --nocapture
        env:
          AUR_LARGE: "100000"
