name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit carries a Signed-off-by line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+>$'; then
              echo "Missing 'Signed-off-by' on $c ($(git show -s --format=%s "$c"))"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Add it with 'git commit -s' (or 'git rebase --signoff') and push again."
          fi
          exit "$fail"
